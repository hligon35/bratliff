name: Monthly Maintenance

# Runs monthly, applies only low-risk deterministic updates, always writes
# monthlyReport.md, and opens/updates a PR from `monthlyUpdate` into the
# default branch for human review. This workflow NEVER deploys production,
# NEVER applies D1 migrations to production, NEVER touches production R2
# objects or Cloudflare/DNS/Access/WAF settings, and NEVER merges the PR.

on:
  schedule:
    # 06:00 UTC on the 1st of every month.
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: scan and report only, do not update dependencies or push changes."
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: monthly-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity for automation commits
        run: |
          git config user.name "jpp-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Determine dry-run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "flag=--dry-run" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or safely reuse the monthlyUpdate branch
        run: node scripts/maintenance/sync-branch.mjs --default-branch "${{ github.event.repository.default_branch }}"

      - name: Run monthly maintenance checks
        id: maintenance
        continue-on-error: true
        run: |
          node scripts/monthly-maintenance.mjs \
            --trigger "${{ github.event_name }}" \
            --workflow-run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --repository "${{ github.repository }}" \
            --default-branch "${{ github.event.repository.default_branch }}" \
            ${{ steps.mode.outputs.flag }}

      - name: Commit maintenance changes (if any)
        id: commit
        run: |
          git add -A -- . ':!node_modules'
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(maintenance): monthly automated report and safe updates

Maintenance-Bot: true"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push monthlyUpdate branch
        if: steps.commit.outputs.changed == 'true'
        run: git push --force-with-lease origin monthlyUpdate

      - name: Create or update the maintenance pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="${{ github.event.repository.default_branch }}"
          EXISTING_PR=$(gh pr list --head monthlyUpdate --base "$BASE" --state open --json number --jq '.[0].number // empty')
          TITLE="Monthly maintenance: $(date -u +'%Y-%m-%d')"
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "$TITLE" --body-file monthlyReport.md
          else
            gh pr create \
              --head monthlyUpdate \
              --base "$BASE" \
              --title "$TITLE" \
              --body-file monthlyReport.md \
              --label maintenance \
              --label dependencies \
              --label security-review
          fi

      - name: Upload monthlyReport.md as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: monthly-report-${{ github.run_id }}
          path: monthlyReport.md
          retention-days: 90

      - name: Fail the job if critical/blocking findings were reported
        if: steps.maintenance.outcome == 'failure'
        run: |
          echo "Maintenance run reported critical or blocking findings — see monthlyReport.md / the PR body."
          exit 1
