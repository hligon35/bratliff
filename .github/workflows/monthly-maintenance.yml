name: Monthly Maintenance

# Monthly check-up. By default it only LOOKS (scan, no changes) and emails a plain-English
# summary. Safe fixes are applied only when a person starts this workflow manually with
# "Apply the safe fixes" ticked; that run opens/updates a PR from `monthlyUpdate` for human
# review. This workflow NEVER deploys production, NEVER applies D1 migrations to production,
# NEVER touches production R2 objects or Cloudflare/DNS/Access/WAF settings, and NEVER merges.
# Email needs the repository secrets RESEND_API_KEY, MAINTENANCE_EMAIL_TO and
# MAINTENANCE_EMAIL_FROM (see docs/maintenance.md).

on:
  schedule:
    - cron: "0 13 1 * *"
  workflow_dispatch:
    inputs:
      apply_fixes:
        description: "Apply the safe fixes (in-range dependency updates) and open a pull request for review."
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: monthly-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity for automation commits
        run: |
          git config user.name "jpp-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Determine mode (scan only unless fixes were approved)
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.apply_fixes }}" = "true" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--dry-run" >> "$GITHUB_OUTPUT"
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or safely reuse the monthlyUpdate branch
        if: steps.mode.outputs.apply == 'true'
        run: node scripts/maintenance/sync-branch.mjs --default-branch "${{ github.event.repository.default_branch }}"

      - name: Run monthly maintenance checks
        id: maintenance
        continue-on-error: true
        run: |
          node scripts/monthly-maintenance.mjs \
            --trigger "${{ github.event_name }}" \
            --workflow-run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --repository "${{ github.repository }}" \
            --default-branch "${{ github.event.repository.default_branch }}" \
            ${{ steps.mode.outputs.flag }}

      - name: Email the plain-English summary
        id: email
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAINTENANCE_EMAIL_TO: ${{ secrets.MAINTENANCE_EMAIL_TO }}
          MAINTENANCE_EMAIL_FROM: ${{ secrets.MAINTENANCE_EMAIL_FROM }}
        run: node scripts/maintenance/send-summary.mjs

      - name: Commit maintenance changes (approved fixes only)
        id: commit
        if: steps.mode.outputs.apply == 'true'
        run: |
          git add -A -- . ':!node_modules' ':!maintenance-summary.*'
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(maintenance): monthly automated report and safe updates" \
              -m "Maintenance-Bot: true"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push monthlyUpdate branch
        if: steps.commit.outputs.changed == 'true'
        run: git push --force-with-lease origin monthlyUpdate

      - name: Create or update the maintenance pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create maintenance --color "0E8A16" --description "Automated monthly maintenance" 2>/dev/null || true
          gh label create dependencies --color "0366D6" --description "Dependency updates" 2>/dev/null || true
          gh label create security-review --color "D93F0B" --description "Requires security review before merge" 2>/dev/null || true

          BASE="${{ github.event.repository.default_branch }}"
          EXISTING_PR=$(gh pr list --head monthlyUpdate --base "$BASE" --state open --json number --jq '.[0].number // empty')
          TITLE="Monthly maintenance: $(date -u +'%Y-%m-%d')"
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "$TITLE" --body-file monthlyReport.md
          else
            gh pr create \
              --head monthlyUpdate \
              --base "$BASE" \
              --title "$TITLE" \
              --body-file monthlyReport.md \
              --label maintenance \
              --label dependencies \
              --label security-review
          fi

      - name: Upload reports as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monthly-report-${{ github.run_id }}
          path: |
            monthlyReport.md
            maintenance-summary.txt
          retention-days: 90

      - name: Fail the job if the email could not be sent
        if: steps.email.outcome == 'failure'
        run: |
          echo "The summary email was not sent (see the 'Email the plain-English summary' step)."
          exit 1

      - name: Fail the job if critical/blocking findings were reported
        if: steps.maintenance.outcome == 'failure'
        run: |
          echo "Maintenance run reported critical or blocking findings; see monthlyReport.md and maintenance-summary.txt."
          exit 1
