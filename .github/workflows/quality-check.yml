name: Quality Checks

on:
  workflow_dispatch:
  push:
    branches: [main, major-update, mailbox, monthlyUpdate, update]
  pull_request:
    branches: [main, major-update]

permissions:
  contents: read

jobs:
  validate:
    # Avoid the ubuntu-latest image migration scheduled for October 19, before launch.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate GitHub Actions workflows
        # Install a checksum-verified CLI; repository policy disallows third-party actions.
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run release:check
      - run: npm run worker:check
      - run: npm run test:maintenance
      - name: Rehearse the complete migration chain on local D1
        run: npx wrangler d1 migrations apply DB --local --env="" --config cloudflare/wrangler.jsonc --persist-to .wrangler/release-validation
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm run worker:prepare
      - name: Validate deployment bundle without publishing
        run: npx wrangler deploy --dry-run --env="" --config cloudflare/wrangler.jsonc
        env:
          WRANGLER_SEND_METRICS: 'false'
