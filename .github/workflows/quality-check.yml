name: Quality Checks

on:
  push:
    branches: [major-update, mailbox]
  pull_request:
    branches: [major-update]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run worker:check
      - run: npm run test:maintenance
