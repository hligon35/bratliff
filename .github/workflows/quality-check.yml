name: Quality Checks

on:
  push:
    branches: [main, major-update, mailbox, monthlyUpdate]
  pull_request:
    branches: [main, major-update]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run worker:check
      - run: npm run test:maintenance
