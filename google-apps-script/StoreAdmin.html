<!doctype html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--navy:#0a1628;--purple:#542476;--gold:#d4ad55;--cream:#fbf8f1;--paper:#fff;--ink:#182033;--muted:#657087;--line:#e7dfcf;--danger:#9d2f2f;--ok:#1e6b49}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:14px/1.5 Arial,sans-serif}button,input,select,textarea{font:inherit}.shell{min-height:100vh}.topbar{position:sticky;top:0;z-index:10;background:var(--gold);border-bottom:1px solid rgba(84,36,118,.3)}.topbar-inner{max-width:1280px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:16px}.brand{font:700 22px Georgia,serif;color:var(--navy)}.brand small{display:block;font:700 10px Arial,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--purple)}.nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.nav button{border:0;background:transparent;padding:10px 14px;border-radius:999px;font-weight:700;color:var(--navy);cursor:pointer}.nav button.active,.nav button:hover{background:var(--purple);color:#fff}.main{max-width:1280px;margin:auto;padding:28px 18px 60px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.hero h1{margin:0;font:700 clamp(28px,4vw,44px) Georgia,serif;color:var(--navy)}.hero p{margin:7px 0 0;color:var(--muted)}.btn{border:1px solid var(--purple);background:var(--purple);color:#fff;border-radius:999px;padding:11px 16px;font-weight:700;cursor:pointer}.btn.alt{background:#fff;color:var(--purple)}.btn.warn{background:var(--danger);border-color:var(--danger)}.grid{display:grid;gap:16px}.metrics{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:24px}.metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.metric strong{display:block;font:700 28px Georgia,serif;color:var(--navy)}.metric span{color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font:700 24px Georgia,serif;color:var(--navy)}.panel-body{padding:20px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}.table th{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--purple);background:#fcfaf5}.cover{width:54px;height:72px;object-fit:contain;background:transparent}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#f3ecdf;font-size:11px;font-weight:700}.badge.low{background:#fde8e8;color:#8b2323}.tabs>[data-view]{display:none}.tabs>[data-view].show{display:block}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:var(--purple)}.field input,.field select,.field textarea{width:100%;border:1px solid #d8cfbf;border-radius:8px;padding:10px;background:#fff}.field textarea{min-height:120px;resize:vertical}.checks{display:flex;gap:18px;flex-wrap:wrap}.checks label{display:flex;gap:8px;align-items:center}.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.image-preview{width:180px;aspect-ratio:3/4;display:grid;place-items:center;background:transparent;border:1px dashed #c8bda9;border-radius:10px;overflow:hidden}.image-preview img{width:100%;height:100%;object-fit:contain}.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:18px}.status{min-height:22px;margin-top:12px;font-weight:700}.status.ok{color:var(--ok)}.status.err{color:var(--danger)}.empty{padding:28px;text-align:center;color:var(--muted)}
    @media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.topbar-inner{align-items:flex-start;flex-direction:column}.nav{margin-left:0}.hero{align-items:flex-start;flex-direction:column}}
    @media(max-width:520px){.metrics{grid-template-columns:1fr}.main{padding-inline:12px}.panel-body{padding:14px}.nav button{padding:8px 10px}}
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar"><div class="topbar-inner"><div class="brand">Jackrabbit Punkin<small>Publisher Store Manager</small></div><div class="nav"><button class="active" data-tab="overview">Overview</button><button data-tab="books">Books</button><button data-tab="orders">Orders</button><button data-tab="inventory">Inventory</button></div></div></header>
  <main class="main">
    <div class="hero"><div><h1>Publisher Store Manager</h1><p>Publish books, manage inventory, and track store sales without changing the website layout.</p></div><button class="btn" id="setupBtn">Initialize / Repair Store</button></div>
    <div class="tabs">
      <section data-view="overview" class="show"><div class="grid metrics" id="metrics"></div><div class="panel"><div class="panel-head"><h2>Recent Orders</h2></div><div class="panel-body table-wrap" id="recentOrders"></div></div></section>
      <section data-view="books"><div class="split"><div class="panel"><div class="panel-head"><h2>Books</h2><button class="btn" id="newBookBtn">+ Add Book</button></div><div class="panel-body table-wrap" id="bookList"></div></div><div class="panel"><div class="panel-head"><h2 id="formTitle">Add Book</h2></div><div class="panel-body"><form id="bookForm"><input type="hidden" name="bookId"><div class="form-grid">
        <div class="field"><label>SKU *</label><input name="sku" required></div><div class="field"><label>ISBN</label><input name="isbn"></div><div class="field full"><label>Title *</label><input name="title" required></div><div class="field full"><label>Subtitle</label><input name="subtitle"></div><div class="field"><label>Author</label><input name="author"></div><div class="field"><label>Category</label><input name="category"></div><div class="field"><label>Format</label><select name="format"><option>Hardcover</option><option>Paperback</option><option>Ebook</option><option>Other</option></select></div><div class="field"><label>Publication Date</label><input type="date" name="publicationDate"></div><div class="field"><label>Price *</label><input type="number" step="0.01" min="0" name="price" required></div><div class="field"><label>Compare-at Price</label><input type="number" step="0.01" min="0" name="comparePrice"></div><div class="field"><label>Stock</label><input type="number" min="0" name="stock" value="0"></div><div class="field"><label>Low Stock Alert</label><input type="number" min="0" name="lowStockThreshold" value="5"></div><div class="field full"><label>Short Description</label><textarea name="shortDescription"></textarea></div><div class="field full"><label>Synopsis</label><textarea name="synopsis"></textarea></div><div class="field"><label>Status</label><select name="status"><option>Draft</option><option>Coming Soon</option><option>Published</option><option>Out of Stock</option><option>Archived</option></select></div><div class="field"><label>Product Image</label><input type="file" id="bookImage" accept="image/png,image/jpeg,image/webp"></div><div class="field full"><div class="checks"><label><input type="checkbox" name="featured"> Featured</label><label><input type="checkbox" name="comingSoon"> Coming Soon</label><label><input type="checkbox" name="preorder"> Allow Preorders</label></div></div><div class="field full"><div class="image-preview" id="imagePreview"><span>No image</span></div></div>
      </div><div class="form-actions"><button class="btn" type="submit">Save Book</button><button class="btn alt" type="button" id="publishBtn">Publish</button><button class="btn warn" type="button" id="archiveBtn">Archive</button></div><div class="status" id="bookStatus"></div></form></div></div></div></section>
      <section data-view="orders"><div class="panel"><div class="panel-head"><h2>Orders</h2></div><div class="panel-body table-wrap" id="orderList"></div></div></section>
      <section data-view="inventory"><div class="panel"><div class="panel-head"><h2>Inventory</h2></div><div class="panel-body table-wrap" id="inventoryList"></div></div></section>
    </div>
  </main>
</div>
<script>
  var books=[];
  function $(s){return document.querySelector(s)}
  function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
  function money(v){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(v||0))}
  function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]})}
  function run(name,args){args=args||[];return new Promise(function(resolve,reject){var r=google.script.run.withSuccessHandler(resolve).withFailureHandler(function(e){reject(new Error(e&&e.message?e.message:e))});r[name].apply(r,args)})}
  $$('[data-tab]').forEach(function(b){b.onclick=function(){$$('[data-tab]').forEach(function(x){x.classList.toggle('active',x===b)});$$('[data-view]').forEach(function(v){v.classList.toggle('show',v.dataset.view===b.dataset.tab)});if(b.dataset.tab==='inventory')loadInventory();if(b.dataset.tab==='orders')loadOrders()}})
  async function refresh(){await Promise.all([loadMetrics(),loadBooks(),loadOrders()])}
  async function loadMetrics(){try{var m=await run('getStoreDashboardMetrics');var data=[['Total Sales',money(m.totalSales)],['Books Sold',m.booksSold],['Orders',m.orderCount],['Average Order',money(m.averageOrder)],['Low Stock',m.lowStockCount]];$('#metrics').innerHTML=data.map(function(x){return '<div class="metric"><strong>'+esc(x[1])+'</strong><span>'+esc(x[0])+'</span></div>'}).join('')}catch(e){$('#metrics').innerHTML='<div class="empty">Initialize the store to begin.</div>'}}
  async function loadBooks(){try{books=await run('listStoreBooksAdmin');if(!books.length){$('#bookList').innerHTML='<div class="empty">No books yet.</div>';return}var rows=books.map(function(b){return '<tr><td>'+(b.imageUrl?'<img class="cover" src="'+esc(b.imageUrl)+'">':'')+'</td><td><b>'+esc(b.title)+'</b><br><small>'+esc(b.author)+'</small></td><td>'+esc(b.sku)+'</td><td>'+money(b.price)+'</td><td>'+esc(b.stock)+'</td><td><span class="badge">'+esc(b.status)+'</span></td><td><button class="btn alt" data-edit="'+esc(b.bookId)+'">Edit</button></td></tr>'}).join('');$('#bookList').innerHTML='<table class="table"><thead><tr><th>Cover</th><th>Title</th><th>SKU</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';$$('[data-edit]').forEach(function(btn){btn.onclick=function(){editBook(btn.dataset.edit)}})}catch(e){$('#bookList').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
  function editBook(id){var b=books.find(function(x){return x.bookId===id});if(!b)return;var f=$('#bookForm');Object.keys(b).forEach(function(k){var el=f.elements[k];var v=b[k];if(!el)return;if(el.type==='checkbox')el.checked=!!v;else if(k==='publicationDate'&&v)el.value=new Date(v).toISOString().slice(0,10);else el.value=v==null?'':v});$('#formTitle').textContent='Edit Book';$('#imagePreview').innerHTML=b.imageUrl?'<img src="'+esc(b.imageUrl)+'">':'<span>No image</span>';window.scrollTo({top:0,behavior:'smooth'})}
  $('#newBookBtn').onclick=function(){var f=$('#bookForm');f.reset();f.elements.bookId.value='';f.elements.lowStockThreshold.value=5;$('#formTitle').textContent='Add Book';$('#imagePreview').innerHTML='<span>No image</span>';$('#bookStatus').textContent=''};
  $('#bookImage').onchange=function(e){var file=e.target.files[0];if(!file)return;var r=new FileReader();r.onload=function(){$('#imagePreview').innerHTML='<img src="'+r.result+'">'};r.readAsDataURL(file)};
  function formData(){var f=$('#bookForm');var o={};new FormData(f).forEach(function(v,k){o[k]=v});['featured','comingSoon','preorder'].forEach(function(k){o[k]=f.elements[k].checked});return o}
  function fileToBase64(file){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(file)})}
  $('#bookForm').onsubmit=async function(e){e.preventDefault();var s=$('#bookStatus');s.textContent='Saving...';s.className='status';try{var b=await run('saveStoreBook',[formData()]);var file=$('#bookImage').files[0];if(file){var data=await fileToBase64(file);await run('uploadStoreBookImage',[b.bookId,file.name,file.type,data.split(',')[1]]);b=await run('getStoreBookById',[b.bookId])}s.textContent='Saved.';s.className='status ok';await refresh();editBook(b.bookId)}catch(err){s.textContent=err.message;s.className='status err'}};
  $('#publishBtn').onclick=async function(){var id=$('#bookForm').elements.bookId.value;if(!id)return alert('Save the book first.');await run('publishStoreBook',[id]);await refresh();editBook(id)};
  $('#archiveBtn').onclick=async function(){var id=$('#bookForm').elements.bookId.value;if(!id)return;if(confirm('Archive this book?')){await run('archiveStoreBook',[id]);await refresh();$('#newBookBtn').click()}};
  async function loadOrders(){try{var orders=await run('listStoreOrders',[100]);var html='<div class="empty">No orders yet.</div>';if(orders.length){var rows=orders.map(function(o){return '<tr><td><b>'+esc(o.orderNumber)+'</b></td><td>'+new Date(o.date).toLocaleDateString()+'</td><td>'+esc(o.customer)+'<br><small>'+esc(o.email)+'</small></td><td>'+money(o.total)+'</td><td>'+esc(o.paymentStatus)+'</td><td>'+esc(o.fulfillmentStatus)+'</td></tr>'}).join('');html='<table class="table"><thead><tr><th>Order</th><th>Date</th><th>Customer</th><th>Total</th><th>Payment</th><th>Fulfillment</th></tr></thead><tbody>'+rows+'</tbody></table>'}$('#orderList').innerHTML=html;$('#recentOrders').innerHTML=html}catch(e){$('#orderList').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
  async function loadInventory(){try{var rows=await run('getStoreInventorySummary');if(!rows.length){$('#inventoryList').innerHTML='<div class="empty">No inventory yet.</div>';return}var body=rows.map(function(b){var low=Number(b.stock)<=Number(b.lowStockThreshold);return '<tr><td><b>'+esc(b.title)+'</b></td><td>'+esc(b.sku)+'</td><td>'+esc(b.stock)+'</td><td>'+esc(b.lowStockThreshold)+'</td><td><span class="badge '+(low?'low':'')+'">'+(low?'Low stock':'Healthy')+'</span></td></tr>'}).join('');$('#inventoryList').innerHTML='<table class="table"><thead><tr><th>Book</th><th>SKU</th><th>Stock</th><th>Alert At</th><th>Status</th></tr></thead><tbody>'+body+'</tbody></table>'}catch(e){$('#inventoryList').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
  $('#setupBtn').onclick=async function(){try{await run('setupPublisherStore');await refresh();alert('Publisher Store Manager is ready.')}catch(e){alert(e.message)}};
  refresh();
</script>
</body>
</html>
