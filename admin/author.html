<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="/assets/icons/jrppLogo.png" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <base href="../" />
    <title>Featured Author Manager | Jackrabbit Punkin Publishing LLC</title>
    <meta
      name="description"
      content="Protected publisher featured-author manager for Jackrabbit Punkin Publishing LLC."
    />
    <script>try{if(localStorage.getItem("jrpp-workspace-drawer")==="collapsed")document.documentElement.classList.add("drawer-collapsed")}catch(e){}</script>
    <link rel="stylesheet" href="assets/admin-author.css" />
    <link rel="preload" href="/assets/material-icons.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="assets/admin-shell.css" />
    <script src="assets/site-config.js" defer></script>
    <script src="assets/admin-shell.js" defer></script>
    <script src="assets/admin-author.js" defer></script>
  <link rel="apple-touch-icon" href="/assets/icons/jppIcon-180.png" /></head>
  <body data-page="admin" data-admin-page="author">
    <a class="skip-link" href="/admin/author.html#workspaceMain">Skip to main content</a>
    <div class="app-shell">
      <aside class="drawer" id="workspaceDrawer" data-admin-shell-drawer aria-label="Admin workspace navigation"></aside>
      <main class="workspace" id="workspaceMain" tabindex="-1">
        <header class="workspace-header" data-admin-shell-header></header>
        <div class="notice" id="workspaceNotice" role="status" aria-live="polite" hidden></div>
        <div class="page-content">

    <div class="shell">
      <div class="main">
        <div class="hero">
          <div>
            <h2>Featured Author Manager</h2>
            <p>
              Manage the JPP Author Spotlight shown on the Media page. Only one
              author can be Published at a time&mdash;publishing a new one
              automatically un-publishes the previous one.
            </p>
          </div>
        </div>
        <div class="split">
          <div class="panel">
            <div class="panel-head"><h2>Authors</h2></div>
            <div class="panel-body">
              <div class="toolbar toolbar-sponsors">
                <div class="toolbar-field">
                  <label for="authorStatusFilter">Status</label>
                  <select id="authorStatusFilter" title="Author status filter">
                    <option value="">All statuses</option>
                    <option value="Draft">Draft</option>
                    <option value="Published">Published</option>
                  </select>
                </div>
              </div>
              <div class="table-wrap" id="authorList"></div>
            </div>
          </div>
          <div class="panel">
            <div class="panel-head">
              <h2 id="authorFormTitle">Author Details</h2>
              <span class="badge" id="authorStatusPill">Draft</span>
            </div>
            <div class="panel-body">
              <form id="authorForm">
                <input type="hidden" name="authorId" />
                <div class="form-grid">
                  <div class="field full">
                    <label>Name *</label><input name="name" title="Name" required placeholder="e.g., Maria Alvarez" />
                  </div>
                  <div class="field full">
                    <label>Title / Role</label><input name="title" title="Title / Role" placeholder="Author, educator, poet..." />
                  </div>
                  <div class="field full">
                    <label>Bio</label><textarea name="biography" title="Bio" placeholder="A concise bio for the public author spotlight."></textarea>
                  </div>
                  <div class="field full">
                    <label>Website</label><input type="url" name="websiteUrl" title="Website" placeholder="https://authorwebsite.com" />
                  </div>
                  <div class="field full"><p class="form-section-label">Socials</p></div>
                  <div class="field"><label>Facebook</label><input type="url" id="authorFacebook" name="facebook" placeholder="https://facebook.com/..." /></div>
                  <div class="field"><label>Instagram</label><input type="url" id="authorInstagram" name="instagram" placeholder="https://instagram.com/..." /></div>
                  <div class="field"><label>LinkedIn</label><input type="url" id="authorLinkedIn" name="linkedin" placeholder="https://linkedin.com/in/..." /></div>
                  <div class="field"><label>TikTok</label><input type="url" id="authorTikTok" name="tiktok" placeholder="https://tiktok.com/@..." /></div>
                  <div class="field"><label>YouTube</label><input type="url" id="authorYouTube" name="youtube" placeholder="https://youtube.com/@..." /></div>
                  <div class="field">
                    <label>Feature Start (optional)</label><input type="datetime-local" name="startAt" title="Feature Start" />
                  </div>
                  <div class="field">
                    <label>Feature End (optional)</label><input type="datetime-local" name="endAt" title="Feature End" />
                  </div>
                  <div class="field media-upload-field">
                    <label>Author Image</label>
                    <input type="file" id="authorPortrait" name="portrait" title="Author Image" accept="image/png,image/jpeg,image/webp" />
                    <div class="image-preview" id="authorPortraitPreview"><span>No author image</span></div>
                  </div>
                  <div class="field media-upload-field">
                    <label>Book Image</label>
                    <input type="file" id="authorBookImage" name="bookImage" title="Book Image" accept="image/png,image/jpeg,image/webp" />
                    <div class="image-preview" id="authorBookImagePreview"><span>No book image</span></div>
                  </div>
                </div>
                <div class="form-actions">
                  <button class="btn" type="submit">Save Author</button>
                  <button class="btn alt" type="button" id="publishAuthorBtn">Publish to Media Page</button>
                  <button class="btn warn" type="button" id="hideAuthorBtn">Unpublish</button>
                  <button class="btn" type="button" id="newAuthorBtn">New Author</button>
                </div>
                <div class="status" id="authorStatus"></div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
          </div>
      </main>
    </div>
  </body>
</html>
