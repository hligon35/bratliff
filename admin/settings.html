<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>Settings | Publisher Admin</title><link rel="stylesheet" href="assets/admin.css"><script src="assets/site-config.js" defer></script><script src="assets/admin.js" defer></script></head>
<body data-page="admin" data-admin-page="settings"><div class="jrpp-admin-switcher">
      <a class="jrpp-admin-home" href="index.html" aria-label="Jackrabbit Punkin Publishing home">
        <img class="jrpp-admin-logo" src="assets/jrppLogo2.png" alt="Jackrabbit Punkin Publishing" />
        <span class="jrpp-admin-brandcopy">Jackrabbit Punkin Publishing<small>Secure Admin System</small></span>
      </a>
      <div class="jrpp-admin-nav" role="navigation" aria-label="Admin pages"></div>
      <div class="jrpp-admin-actions">
        <button type="button" class="jrpp-admin-action" id="globalRefreshBtn">Refresh</button>
        <button type="button" class="jrpp-admin-action" id="globalLogoutBtn">Sign Out</button>
      </div>
    </div>
<main class="main"><header class="page-head"><div><p class="eyebrow">ACCOUNT</p><h1>Settings</h1><p>Update your profile and sign-in email.</p></div></header>
<section class="panel settings-panel"><div class="panel-head"><h2>Profile</h2></div><div class="panel-body"><form id="settingsForm"><div class="settings-layout"><div><div class="settings-avatar-preview" id="settingsAvatarPreview"><span>No avatar</span></div><label class="btn alt settings-avatar-button">Change avatar<input type="file" id="settingsAvatar" name="avatar" accept="image/png,image/jpeg,image/webp" hidden></label></div><div class="form-grid"><div class="field"><label>Display Name</label><input name="displayName" id="settingsDisplayName"></div><div class="field"><label>Name</label><input name="name" id="settingsName"></div><div class="field full"><label>Email</label><input type="email" name="email" id="settingsEmail" required></div></div></div><div class="form-actions"><button class="btn" type="submit">Save Settings</button></div><div class="status" id="settingsStatus"></div></form></div></section></main></body></html>
