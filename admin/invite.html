<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0a1628">
  <title>Admin invitation | Jackrabbit Punkin Publishing</title>
  <script src="/assets/site-config.js" defer></script><script src="/assets/admin-invite.js" defer></script>
  <style>
    :root{color-scheme:light;--navy:#0a1628;--gold:#d4ad55;--cream:#fbf8f1;--ink:#182033;--muted:#657087}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--cream);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(520px,100%);padding:clamp(24px,6vw,42px);border:1px solid #e7dfcf;border-radius:16px;background:#fff;box-shadow:0 20px 50px #0a162814}
    .brand{margin:0 0 10px;color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
    h1{margin:0 0 12px;color:var(--navy);font:700 clamp(28px,5vw,38px)/1.1 Georgia,serif}
    p{margin:0 0 18px}.status{min-height:24px;color:var(--muted)}.status.error{color:#a51d2d}.status.success{color:#276447}
    button,.link{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 18px;border:0;border-radius:7px;background:var(--navy);color:white;font:700 15px system-ui;text-decoration:none;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}.link{margin-top:8px;background:var(--gold);color:var(--navy)}[hidden]{display:none!important}
  </style>
</head>
<body><main>
  <p class="brand">Jackrabbit Punkin Publishing</p><h1>Admin workspace invitation</h1>
  <p id="inviteIntro">This secure invitation link can be used once and expires after 7 days.</p>
  <p class="status" id="inviteStatus" role="status" aria-live="polite"></p>
  <button id="acceptInvite" type="button">Accept invitation</button>
  <a class="link" id="loginLink" href="/login/?returnTo=%2Fadmin%2F" hidden>Continue to admin sign in</a>
</main></body></html>
