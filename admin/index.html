<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <base href="../" />
    <title>Publisher Admin | Jackrabbit Punkin Publishing LLC</title>
    <meta
      name="description"
      content="Protected publisher administration console for Jackrabbit Punkin Publishing LLC."
    />
    <link rel="stylesheet" href="assets/admin.css" />
    <script src="assets/site-config.js" defer></script>
    <script src="assets/admin.js" defer></script>
  </head>
  <body data-page="admin" data-admin-page="dashboard">
    <div class="jrpp-admin-switcher">
      <a class="jrpp-admin-home" href="admin/index.html" aria-label="Jackrabbit Punkin Publishing admin dashboard">
        <img class="jrpp-admin-logo" src="assets/jrppLogo.png" alt="Jackrabbit Punkin Publishing" />
        <span class="jrpp-admin-brandcopy">
          Jackrabbit Punkin Publishing
          <small>Secure Admin System</small>
        </span>
      </a>
      <div class="jrpp-admin-nav" role="navigation" aria-label="Admin pages">
        <a class="jrpp-admin-profile-link" href="admin/profile.html" aria-label="Admin users and access">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 12.2a4.1 4.1 0 1 0-4.1-4.1 4.1 4.1 0 0 0 4.1 4.1Zm0 2c-4.05 0-7.35 2.1-7.35 4.7V21h14.7v-2.1c0-2.6-3.3-4.7-7.35-4.7Z" />
          </svg>
        </a>
        <a class="active" href="admin/index.html" aria-current="page">Admin Dashboard</a>
        <a href="admin/store.html">Book Store Manager</a>
        <a href="admin/newsletter.html">Newsletter Builder</a>
      </div>
      <div class="jrpp-admin-actions">
        <button type="button" class="jrpp-admin-action" id="globalRefreshBtn">Refresh</button>
        <button type="button" class="jrpp-admin-action" id="globalLogoutBtn">Sign Out</button>
      </div>
    </div>

    <div class="dashboard-page">
      <section class="dashboard-stage">
        <header class="dashboard-header">
          <div class="dashboard-header-copy">
            <div class="dashboard-kicker">GOOGLE ACCOUNT REQUIRED</div>
            <h1>Jackrabbit Punkin Admin Dashboard</h1>
            <p>
              Signed in as
              <span id="dashboardViewerEmail" data-viewer-email>Loading secure session...</span>.
              Review recent form activity and jump into the live spreadsheet.
            </p>
          </div>
        </header>
        <div class="dashboard-accent"></div>
        <div class="dashboard-body">
          <div class="dashboard-summary" id="dashboardSummary"></div>
          <div id="dashboardSections"></div>
        </div>
      </section>
    </div>
  </body>
</html>
