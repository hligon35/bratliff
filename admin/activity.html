<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>Activity Log | Publisher Admin</title>
    <script>
      try {
        if (window.localStorage.getItem("jrpp-admin-drawer-collapsed") === "1") {
          document.documentElement.classList.add("admin-drawer-collapsed");
        }
      } catch (error) {}
    </script>
    <link rel="stylesheet" href="assets/admin.css" /><script src="assets/site-config.js" defer></script><script src="assets/admin.js" defer></script></head>
<body data-page="admin" data-admin-page="activity"><div class="jrpp-admin-switcher">
      <a class="jrpp-admin-home" href="index.html" aria-label="Jackrabbit Punkin Publishing home">
        <img class="jrpp-admin-logo" src="assets/jrppLogo2.png" alt="Jackrabbit Punkin Publishing" />
        <span class="jrpp-admin-brandcopy">Jackrabbit Punkin Publishing<small>Secure Admin System</small></span>
      </a>
      <div class="jrpp-admin-nav" role="navigation" aria-label="Admin pages"></div>
      <div class="jrpp-admin-actions">
        <button type="button" class="jrpp-admin-action" id="globalRefreshBtn">Refresh</button>
        <button type="button" class="jrpp-admin-action" id="globalLogoutBtn">Sign Out</button>
      </div>
    </div>
<main class="main"><section class="activity-log" aria-labelledby="activityLogTitle"><div class="activity-log-head"><div><div class="activity-log-kicker">AUDIT TRAIL</div><h1 id="activityLogTitle">Activity Log</h1><p>Track sign-ins, sign-outs, newsletter saves, sends, and scheduled campaigns.</p></div><button class="btn alt" type="button" id="activityRefreshBtn">Refresh</button></div><div class="activity-filter-chips" role="group" aria-label="Activity log filters"><button class="activity-filter-chip is-active" type="button" data-activity-filter="">All Activity</button><button class="activity-filter-chip" type="button" data-activity-filter="auth">Sign-ins &amp; outs</button><button class="activity-filter-chip" type="button" data-activity-filter="newsletter_saved">Newsletter saves</button><button class="activity-filter-chip" type="button" data-activity-filter="newsletter_sent">Newsletter sends</button><button class="activity-filter-chip" type="button" data-activity-filter="newsletter_scheduled">Scheduled</button></div><div class="status" id="activityLogStatus" aria-live="polite"></div><div class="activity-log-table" id="activityLogTable"></div></section></main></body></html>
